<!DOCTYPE html>
<html>
<head>
  <title>Vocabulary App</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4CAF50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="VocabApp">
  <link rel="apple-touch-icon" href="/icon.png">
  <style>
    body { font-family: Arial; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
    h1 { color: #333; text-align: center; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    input, textarea { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
    button { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
    button:hover { background: #45a049; }
    .btn-red { background: #e53935; }
    .btn-red:hover { background: #c62828; }
    .btn-blue { background: #1976D2; }
    .btn-blue:hover { background: #1565C0; }
    .btn-orange { background: #F57C00; }
    .btn-orange:hover { background: #E65100; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f0f0f0; }
    .hidden { display: none; }
    .practice-card { text-align: center; padding: 30px; }
    .practice-word { font-size: 32px; font-weight: bold; color: #333; margin-bottom: 20px; }
    .practice-meaning { font-size: 18px; color: #666; margin-bottom: 20px; }
    .progress { color: #999; font-size: 14px; margin-bottom: 20px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab { padding: 10px 20px; background: #ddd; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
    .tab.active { background: #4CAF50; color: white; }
    .auth-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    #userInfo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .msg { font-size: 14px; margin-top: 5px; }
    .link-btn { background: none; border: none; color: #1976D2; cursor: pointer; font-size: 14px; padding: 0; text-decoration: underline; }
    .otp-display { background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32; font-weight: bold; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>📚 Vocabulary App</h1>

  <!-- Login Section -->
  <div id="loginSection">
    <div class="auth-box">
      <h2>Login</h2>
      <input id="loginPhone" placeholder="Enter 10 digit phone number" maxlength="10" type="tel" />
      <input id="loginPassword" type="password" placeholder="Enter password" />
      <button onclick="login()">Login</button>
      <br/><br/>
      <button class="link-btn" onclick="showSection('registerSection')">New user? Register</button>
      &nbsp;|&nbsp;
      <button class="link-btn" onclick="showSection('forgotSection')">Forgot Password?</button>
      <p id="loginMsg" class="msg"></p>
    </div>
  </div>

  <!-- Register Section -->
  <div id="registerSection" class="hidden">
    <div class="auth-box">
      <h2>Register</h2>
      <div id="regStep1">
        <input id="regPhone" placeholder="Enter 10 digit phone number" maxlength="10" type="tel" />
        <button onclick="sendRegOTP()">Send OTP</button>
        <br/><br/>
        <button class="link-btn" onclick="showSection('loginSection')">Already registered? Login</button>
        <p id="regMsg1" class="msg"></p>
      </div>
      <div id="regStep2" class="hidden">
        <p class="otp-display" id="regOtpDisplay"></p>
        <input id="regOTP" placeholder="Enter 6 digit OTP" maxlength="6" type="tel" />
        <input id="regPassword" type="password" placeholder="Create password" />
        <input id="regPassword2" type="password" placeholder="Confirm password" />
        <button onclick="verifyRegister()">Register</button>
        <p id="regMsg2" class="msg"></p>
      </div>
    </div>
  </div>

  <!-- Forgot Password Section -->
  <div id="forgotSection" class="hidden">
    <div class="auth-box">
      <h2>Forgot Password</h2>
      <div id="forgotStep1">
        <input id="forgotPhone" placeholder="Enter registered phone number" maxlength="10" type="tel" />
        <button onclick="sendForgotOTP()">Send OTP</button>
        <br/><br/>
        <button class="link-btn" onclick="showSection('loginSection')">Back to Login</button>
        <p id="forgotMsg1" class="msg"></p>
      </div>
      <div id="forgotStep2" class="hidden">
        <p class="otp-display" id="forgotOtpDisplay"></p>
        <input id="forgotOTP" placeholder="Enter 6 digit OTP" maxlength="6" type="tel" />
        <input id="newPassword" type="password" placeholder="Enter new password" />
        <input id="newPassword2" type="password" placeholder="Confirm new password" />
        <button onclick="resetPassword()">Reset Password</button>
        <p id="forgotMsg2" class="msg"></p>
      </div>
    </div>
  </div>

  <!-- Main App Section -->
  <div id="appSection" class="hidden">
    <div id="userInfo">
      <span>👋 Hi, <strong id="welcomeUser"></strong>!</span>
      <button class="btn-red" onclick="logout()">Logout</button>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="showTab('addTab', this)">Add Words</button>
      <button class="tab" onclick="showTab('listTab', this)">Word List</button>
      <button class="tab" onclick="showTab('practiceTab', this)">Practice</button>
    </div>
    <div id="addTab" class="card">
      <h2>Add New Word</h2>
      <input id="wordInput" placeholder="Enter word..." />
      <textarea id="meaningInput" placeholder="Enter meaning..." rows="3"></textarea>
      <button onclick="addWord()">Add Word</button>
      <p id="addMessage"></p>
    </div>
    <div id="listTab" class="card hidden">
      <h2>All Words (<span id="wordCount">0</span>)</h2>
      <table>
        <thead><tr><th>Word</th><th>Meaning</th><th>Action</th></tr></thead>
        <tbody id="wordList"></tbody>
      </table>
    </div>
    <div id="practiceTab" class="card hidden">
      <div id="practiceStart">
        <h2>Practice Mode</h2>
        <p>Words shown one by one in random order. Guess the meaning before revealing!</p>
        <button class="btn-blue" onclick="startPractice()">Start Practice</button>
      </div>
      <div id="practiceArea" class="hidden practice-card">
        <div class="progress">Word <span id="currentNum">1</span> of <span id="totalNum">0</span></div>
        <div class="practice-word" id="practiceWord"></div>
        <button class="btn-orange" onclick="revealMeaning()">Reveal Meaning</button>
        <div class="practice-meaning hidden" id="practiceMeaning"></div>
        <br/><br/>
        <button class="btn-blue hidden" id="nextBtn" onclick="nextWord()">Next Word →</button>
        <button class="btn-red hidden" id="finishBtn" onclick="finishPractice()">Finish</button>
      </div>
      <div id="practiceComplete" class="hidden practice-card">
        <h2>🎉 Practice Complete!</h2>
        <p>You reviewed all words!</p>
        <button class="btn-blue" onclick="startPractice()">Practice Again</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('SW registered'))
          .catch(err => console.log('SW error:', err));
      });
    }
  </script>

  <script>
    let token = localStorage.getItem('vocab_token');
    let phone = localStorage.getItem('vocab_phone');
    let practiceWords = [];
    let currentIndex = 0;
    let regPhoneNum = '';
    let forgotPhoneNum = '';

    if (token) showApp();

    function showSection(id) {
      ['loginSection','registerSection','forgotSection','appSection'].forEach(s => {
        document.getElementById(s).classList.add('hidden');
      });
      document.getElementById(id).classList.remove('hidden');
    }

    async function login() {
      const p = document.getElementById('loginPhone').value.trim();
      const pwd = document.getElementById('loginPassword').value;
      if (!p || !pwd) { showMsg('loginMsg','Please enter phone and password','red'); return; }
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({phone: p, password: pwd})
      });
      const data = await res.json();
      if (data.error) { showMsg('loginMsg', data.error, 'red'); }
      else {
        token = data.token; phone = data.phone;
        localStorage.setItem('vocab_token', token);
        localStorage.setItem('vocab_phone', phone);
        showApp();
      }
    }

    async function sendRegOTP() {
      const p = document.getElementById('regPhone').value.trim();
      if (!p || p.length !== 10) { showMsg('regMsg1','Enter valid 10 digit phone number','red'); return; }
      showMsg('regMsg1','Sending OTP...','blue');
      const res = await fetch('/api/send-otp', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({phone: p})
      });
      const data = await res.json();
      if (data.error) { showMsg('regMsg1', data.error, 'red'); }
      else {
        regPhoneNum = p;
        document.getElementById('regStep1').classList.add('hidden');
        document.getElementById('regStep2').classList.remove('hidden');
        document.getElementById('regOtpDisplay').textContent = data.message;
      }
    }

    async function verifyRegister() {
      const otp = document.getElementById('regOTP').value.trim();
      const pwd = document.getElementById('regPassword').value;
      const pwd2 = document.getElementById('regPassword2').value;
      if (!otp || !pwd) { showMsg('regMsg2','Please fill all fields','red'); return; }
      if (pwd !== pwd2) { showMsg('regMsg2','Passwords do not match','red'); return; }
      const res = await fetch('/api/verify-register', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({phone: regPhoneNum, otp, password: pwd})
      });
      const data = await res.json();
      if (data.error) { showMsg('regMsg2', data.error, 'red'); }
      else {
        showMsg('regMsg2','Registered successfully! Please login.','green');
        setTimeout(() => {
          document.getElementById('regStep1').classList.remove('hidden');
          document.getElementById('regStep2').classList.add('hidden');
          showSection('loginSection');
        }, 2000);
      }
    }

    async function sendForgotOTP() {
      const p = document.getElementById('forgotPhone').value.trim();
      if (!p || p.length !== 10) { showMsg('forgotMsg1','Enter valid 10 digit phone number','red'); return; }
      showMsg('forgotMsg1','Sending OTP...','blue');
      const res = await fetch('/api/forgot-password', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({phone: p})
      });
      const data = await res.json();
      if (data.error) { showMsg('forgotMsg1', data.error, 'red'); }
      else {
        forgotPhoneNum = p;
        document.getElementById('forgotStep1').classList.add('hidden');
        document.getElementById('forgotStep2').classList.remove('hidden');
        document.getElementById('forgotOtpDisplay').textContent = data.message;
      }
    }

    async function resetPassword() {
      const otp = document.getElementById('forgotOTP').value.trim();
      const pwd = document.getElementById('newPassword').value;
      const pwd2 = document.getElementById('newPassword2').value;
      if (!otp || !pwd) { showMsg('forgotMsg2','Please fill all fields','red'); return; }
      if (pwd !== pwd2) { showMsg('forgotMsg2','Passwords do not match','red'); return; }
      const res = await fetch('/api/reset-password', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({phone: forgotPhoneNum, otp, password: pwd})
      });
      const data = await res.json();
      if (data.error) { showMsg('forgotMsg2', data.error, 'red'); }
      else {
        showMsg('forgotMsg2','Password reset successfully! Please login.','green');
        setTimeout(() => {
          document.getElementById('forgotStep1').classList.remove('hidden');
          document.getElementById('forgotStep2').classList.add('hidden');
          showSection('loginSection');
        }, 2000);
      }
    }

    function logout() {
      localStorage.removeItem('vocab_token');
      localStorage.removeItem('vocab_phone');
      token = null; practiceWords = []; currentIndex = 0;
      document.getElementById('practiceStart').classList.remove('hidden');
      document.getElementById('practiceArea').classList.add('hidden');
      document.getElementById('practiceComplete').classList.add('hidden');
      showSection('loginSection');
    }

    function showApp() {
      showSection('appSection');
      document.getElementById('welcomeUser').textContent = phone;
      ['addTab','listTab','practiceTab'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('addTab').classList.remove('hidden');
      document.querySelectorAll('.tab')[0].classList.add('active');
    }

    function showMsg(id, msg, color) {
      const e = document.getElementById(id);
      e.textContent = msg; e.style.color = color;
    }

    function showTab(tabId, btn) {
      ['addTab','listTab','practiceTab'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(tabId).classList.remove('hidden');
      btn.classList.add('active');
      if (tabId === 'listTab') loadWords();
    }

    async function addWord() {
      const word = document.getElementById('wordInput').value.trim();
      const meaning = document.getElementById('meaningInput').value.trim();
      if (!word || !meaning) {
        document.getElementById('addMessage').textContent = 'Please enter both word and meaning!';
        document.getElementById('addMessage').style.color = 'red';
        return;
      }
      await fetch('/api/words', {
        method: 'POST',
        headers: {'Content-Type':'application/json','Authorization':token},
        body: JSON.stringify({word, meaning})
      });
      document.getElementById('wordInput').value = '';
      document.getElementById('meaningInput').value = '';
      document.getElementById('addMessage').textContent = '✅ Word added successfully!';
      document.getElementById('addMessage').style.color = 'green';
      setTimeout(() => document.getElementById('addMessage').textContent = '', 2000);
    }

    async function loadWords() {
      const res = await fetch('/api/words', {headers: {'Authorization':token}});
      const words = await res.json();
      document.getElementById('wordCount').textContent = words.length;
      const tbody = document.getElementById('wordList');
      tbody.innerHTML = '';
      if (words.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999;">No words added yet</td></tr>';
        return;
      }
      words.forEach(w => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><strong>${w.word}</strong></td><td>${w.meaning}</td><td><button class="btn-red" onclick="deleteWord(${w.id})">Delete</button></td>`;
        tbody.appendChild(tr);
      });
    }

    async function deleteWord(id) {
      await fetch(`/api/words/${id}`, {method:'DELETE', headers:{'Authorization':token}});
      loadWords();
    }

    async function startPractice() {
      const res = await fetch('/api/practice', {headers:{'Authorization':token}});
      practiceWords = await res.json();
      if (practiceWords.length === 0) { alert('No words added yet!'); return; }
      currentIndex = 0;
      document.getElementById('practiceStart').classList.add('hidden');
      document.getElementById('practiceComplete').classList.add('hidden');
      document.getElementById('practiceArea').classList.remove('hidden');
      document.getElementById('totalNum').textContent = practiceWords.length;
      showWord();
    }

    function showWord() {
      const w = practiceWords[currentIndex];
      document.getElementById('currentNum').textContent = currentIndex + 1;
      document.getElementById('practiceWord').textContent = w.word;
      document.getElementById('practiceMeaning').textContent = w.meaning;
      document.getElementById('practiceMeaning').classList.add('hidden');
      document.getElementById('nextBtn').classList.add('hidden');
      document.getElementById('finishBtn').classList.add('hidden');
    }

    function revealMeaning() {
      document.getElementById('practiceMeaning').classList.remove('hidden');
      if (currentIndex < practiceWords.length - 1) {
        document.getElementById('nextBtn').classList.remove('hidden');
      } else {
        document.getElementById('finishBtn').classList.remove('hidden');
      }
    }

    function nextWord() { currentIndex++; showWord(); }

    function finishPractice() {
      document.getElementById('practiceArea').classList.add('hidden');
      document.getElementById('practiceComplete').classList.remove('hidden');
    }
  </script>
</body>
</html>
